name: Claude Code PR Flow

"on":
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Claude prompt or skill invocation"
        required: false
        default: "/next-wave"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-pr-flow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude Code orchestrator
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CLAUDE_ORCHESTRATOR_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install orchestrator checks
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Preflight orchestrator contracts
        run: |
          ./scripts/check-claude-adapter.sh
          ./scripts/check-skills-runtime.sh
          ./scripts/check-task-dag.sh
      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || github.event.comment.body }}
          claude_args: >-
            --agent main-orchestrator
            --permission-mode bypassPermissions
            --max-turns 350
